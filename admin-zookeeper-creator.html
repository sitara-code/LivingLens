<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Zookeeper Account - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <section class="panel" style="max-width: 1080px;">
        <header class="panel-header">
          <h2>Create Zookeeper Account</h2>
        </header>

        <div class="panel-body">
          <div id="success-banner" style="display: none; background-color: #0ED984; color: #024123; padding: 14px 20px; border-radius: 12px; font-weight: 600; margin-bottom: 24px; text-align: center;">
            ✓ Zookeeper account created successfully! Credentials recorded.
          </div>

          <form id="create-zookeeper-form" novalidate>
            <div class="form-grid-2">
              <div>
                <div class="form-group">
                  <label for="zk-fullname" class="form-label">Full Name *</label>
                  <input
                    type="text"
                    id="zk-fullname"
                    name="fullName"
                    class="pill-input"
                    placeholder="e.g. Dr. Marcus Vance"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="zk-email" class="form-label">Email Address *</label>
                  <input
                    type="email"
                    id="zk-email"
                    name="email"
                    class="pill-input"
                    placeholder="marcus.vance@zoo-wildlife.org"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="zk-zoo" class="form-label">Assigned Zoo *</label>
                  <div class="select-wrapper">
                    <select id="zk-zoo" name="assignedZoo" class="pill-input" required>
                      <option value="" disabled selected>Select assigned zoo...</option>
                      <option value="ZOO-LON-01">Metropolitan City Zoological Gardens</option>
                      <option value="ZOO-SGP-02">Central Wildlife Conservation Park</option>
                      <option value="ZOO-SDG-03">Highland Biosphere &amp; Safari Sanctuary</option>
                      <option value="ZOO-BER-04">Riverside Zoological Park</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label for="zk-temp-code" class="form-label">Temporary Zoo Access code *</label>
                  <input
                    type="password"
                    id="zk-temp-code"
                    name="tempCode"
                    class="pill-input"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <div>
                <div class="form-group">
                  <label for="zk-badge-id" class="form-label">Zookeeper ID / Badge *</label>
                  <input
                    type="text"
                    id="zk-badge-id"
                    name="badgeId"
                    class="pill-input"
                    placeholder="e.g. ZK-8821"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="zk-phone" class="form-label">Phone number *</label>
                  <input
                    type="tel"
                    id="zk-phone"
                    name="phone"
                    class="pill-input"
                    placeholder="+44 7700 900123"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="zk-confirm-code" class="form-label">Confirm Access code *</label>
                  <input
                    type="password"
                    id="zk-confirm-code"
                    name="confirmCode"
                    class="pill-input"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="form-actions-row">
              <button type="button" id="cancel-btn" class="action-btn">
                Cancel
              </button>
              <button type="submit" class="action-btn">
                Create Zookeeper Account
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="panel" style="max-width: 1080px; margin-top: 32px;">
        <header class="panel-header">
          <h2>Zoo Observations</h2>
        </header>
        <div class="panel-body">
          <div id="zoo-observations-grid" style="display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));"></div>
        </div>
      </section>

      <section class="panel" style="max-width: 1080px; margin-top: 32px;">
        <header class="panel-header">
          <h2>Zoo Alerts</h2>
        </header>
        <div class="panel-body">
          <div id="zoo-alerts-grid" style="display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));"></div>
        </div>
      </section>
    </main>

    <script type="module">
      import { requireRole, getCurrentUser } from './js/auth.js';
      import { setupFormValidation, showError } from './js/forms.js';
      import { getObservations, getZooKeepers, addZooKeeper, getZooAlerts } from './js/data.js';
      import './js/nav.js';

      if (requireRole('admin')) {
        const form = document.getElementById('create-zookeeper-form');
        const successBanner = document.getElementById('success-banner');
        const cancelBtn = document.getElementById('cancel-btn');
        const user = getCurrentUser();

        const keepersContainer = document.createElement('div');
        keepersContainer.style.marginTop = '28px';
        keepersContainer.innerHTML = '<p style="font-weight: 700; color: #024123; margin-bottom: 12px;">Zoo Keepers</p>';
        form.parentElement.appendChild(keepersContainer);

        const observationGrid = document.getElementById('zoo-observations-grid');
        const alertGrid = document.getElementById('zoo-alerts-grid');

        async function renderZooObservations() {
          observationGrid.innerHTML = '<p>Loading current observations...</p>';

          try {
            const observations = await getObservations();

            if (!observations.length) {
              observationGrid.innerHTML = '<p>No observations found.</p>';
              return;
            }

            observationGrid.innerHTML = observations.map((obs) => `
              <div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 170px;">
                <p><strong>Animal:</strong> ${obs.animal}</p>
                <p><strong>Observed Behaviour:</strong> ${obs.observedBehaviour}</p>
                <p><strong>Abnormality Percentage:</strong> ${obs.abnormalityPercentage}%</p>
                <p><strong>Duration:</strong> ${obs.durationMinutes} minutes</p>
                <p><strong>Observation Intensity:</strong> ${obs.intensity}</p>
                <p><strong>Keeper ID:</strong> ${obs.keeper_id || 'Not available'}</p>
                <p><strong>Zoo ID:</strong> ${obs.zoo_id || 'Not available'}</p>
                <p><strong>Hazard Probability:</strong> ${obs.hazardProbability == null ? 'Not available' : `${Number(obs.hazardProbability).toFixed(2)}%`}</p>
              </div>
            `).join('');
          } catch (error) {
            console.error('Failed to load current observations:', error);
            observationGrid.innerHTML = '<p>Unable to load current observations right now.</p>';
          }
        }

        function renderZooAlerts() {
          const alerts = getZooAlerts();
          alertGrid.innerHTML = alerts.map((alert) => `
            <div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 160px;">
              <p><strong>Animal:</strong> ${alert.animal}</p>
              <p><strong>Observed Behaviour:</strong> ${alert.observedBehaviour}</p>
              <p><strong>Hazard/Event Likelihood:</strong> ${alert.hazardLikelihood}</p>
              <p><strong>Date/Time:</strong> ${alert.dateTime}</p>
              <p><strong>Advisory / Message:</strong> ${alert.advisory}</p>
            </div>
          `).join('');
        }

        async function renderKeepers() {
          const zooId = user?.zooId || user?.zoo_id || 'Z001';
          keepersContainer.innerHTML = '<p style="font-weight: 700; color: #024123; margin-bottom: 12px;">Zoo Keepers</p><p style="color: #024123;">Loading keepers...</p>';

          try {
            const keepers = await getZooKeepers(zooId);

            if (!keepers.length) {
              keepersContainer.innerHTML = '<p style="font-weight: 700; color: #024123; margin-bottom: 12px;">Zoo Keepers</p><p style="color: #024123;">No zookeepers found for this zoo.</p>';
              return;
            }

            keepersContainer.innerHTML = `
              <p style="font-weight: 700; color: #024123; margin-bottom: 12px;">Zoo Keepers</p>
              <div style="display: grid; gap: 12px;">
                ${keepers.map(keeper => `
                  <div class="card" style="padding: 14px 18px; display: flex; flex-direction: column; gap: 4px;">
                    <strong style="color: #024123;">${keeper.username || keeper.name || 'Unknown keeper'}</strong>
                    <span style="color: #194f38;">ID: ${keeper.keeper_id || keeper.id || 'N/A'}</span>
                    <span style="color: #194f38;">Zoo: ${keeper.zoo_id || zooId}</span>
                  </div>
                `).join('')}
              </div>
            `;
          } catch (error) {
            console.error('Failed to load keepers:', error);
            keepersContainer.innerHTML = '<p style="font-weight: 700; color: #024123; margin-bottom: 12px;">Zoo Keepers</p><p style="color: #024123;">Unable to load keepers right now.</p>';
          }
        }

        cancelBtn.addEventListener('click', () => {
          form.reset();
        });

        setupFormValidation(form, async (data) => {
          const tempCodeInput = document.getElementById('zk-temp-code');
          const confirmCodeInput = document.getElementById('zk-confirm-code');

          if (data.tempCode !== data.confirmCode) {
            showError(confirmCodeInput, 'Access codes do not match');
            return;
          }

          try {
            const payload = {
              username: data.fullName || data.email || data.badgeId,
              keeper_id: data.badgeId,
              zoo_id: user?.zooId || data.assignedZoo || 'Z001'
            };

            await addZooKeeper(payload);
            successBanner.style.display = 'block';
            form.reset();
            await renderKeepers();
            await renderZooObservations();
            renderZooAlerts();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
              successBanner.style.display = 'none';
            }, 4000);
          } catch (error) {
            showError(tempCodeInput, error.message || 'Unable to create the zookeeper account.');
          }
        });

        renderKeepers();
        renderZooObservations();
        renderZooAlerts();
      }
    </script>
  </body>
</html>
