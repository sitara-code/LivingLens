<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Observation - Living Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Iosevka+Charon:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="page-wrapper">
      <section class="panel" style="max-width: 1080px;">
        <header class="panel-header">
          <h2>Upload Observation</h2>
        </header>

        <div class="panel-body">
          <form id="upload-observation-form" novalidate>
            <!-- Row 1: Animal Type & Observed Behaviour -->
            <div class="form-grid-2">
              <div class="form-group">
                <label for="animal-type" class="form-label">Animal Type *</label>
                <div class="select-wrapper">
                  <select id="animal-type" name="animal" class="pill-input" required>
                    <option value="" disabled selected>Select animal...</option>
                    <option value="Elephant">Elephant</option>
                    <option value="Giraffe">Giraffe</option>
                    <option value="Crocodile">Crocodile</option>
                    <option value="Snake">Snake</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="observed-behaviour" class="form-label">Observed Behaviour *</label>
                <div class="select-wrapper">
                  <select id="observed-behaviour" name="observedBehaviour" class="pill-input" required>
                    <option value="" disabled selected>Select behaviour pattern...</option>
                    <option value="Repeated agitations">Repeated agitations</option>
                    <option value="Sudden freeze in place">Sudden freeze in place</option>
                    <option value="Fence pacing & low growls">Fence pacing &amp; low growls</option>
                    <option value="Thrashing in water suddenly">Thrashing in water suddenly</option>
                    <option value="Total silence (no vocalization)">Total silence (no vocalization)</option>
                    <option value="Rushing into tight defensive group">Rushing into tight defensive group</option>
                    <option value="Crawling out in broad daylight">Crawling out in broad daylight</option>
                    <option value="Refusing to enter indoor night barns">Refusing to enter indoor night barns</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Row 2: Animal Counts -->
            <div class="form-grid-2">
              <div class="form-group">
                <label for="total-animals" class="form-label">Total animals of this type in zoo *</label>
                <input
                  type="number"
                  id="total-animals"
                  name="totalAnimals"
                  class="pill-input"
                  min="1"
                  value="10"
                  required
                />
              </div>

              <div class="form-group">
                <label for="animals-showing" class="form-label">Animals showing this behaviour *</label>
                <input
                  type="number"
                  id="animals-showing"
                  name="animalsShowing"
                  class="pill-input"
                  min="1"
                  value="7"
                  required
                />
              </div>
            </div>

            <!-- Row 3: Abnormality, Duration, Intensity -->
            <div class="form-grid-3">
              <div class="form-group">
                <label for="abnormality-percentage" class="form-label">Abnormality Percentage *</label>
                <input
                  type="number"
                  id="abnormality-percentage"
                  name="abnormalityPercentage"
                  class="pill-input"
                  min="0"
                  max="100"
                  value="70"
                  readonly
                  required
                />
              </div>

              <div class="form-group">
                <label for="duration-minutes" class="form-label">Duration for which the behaviour *</label>
                <div style="position: relative; display: flex; align-items: center;">
                  <input
                    type="number"
                    id="duration-minutes"
                    name="durationMinutes"
                    class="pill-input"
                    min="1"
                    value="30"
                    style="padding-right: 80px;"
                    required
                  />
                  <span style="position: absolute; right: 20px; color: #024123; font-weight: 600; font-size: 14px; pointer-events: none;">
                    Minutes
                  </span>
                </div>
              </div>

              <div class="form-group">
                <label for="observation-intensity" class="form-label">Observation Intensity *</label>
                <div class="select-wrapper">
                  <select id="observation-intensity" name="intensity" class="pill-input" required>
                    <option value="10 - Very high" selected>10 - Very high</option>
                    <option value="9 - High">9 - High</option>
                    <option value="8 - High">8 - High</option>
                    <option value="7 - Moderate-High">7 - Moderate-High</option>
                    <option value="6 - Moderate">6 - Moderate</option>
                    <option value="5 - Moderate">5 - Moderate</option>
                    <option value="4 - Low-Moderate">4 - Low-Moderate</option>
                    <option value="3 - Low">3 - Low</option>
                    <option value="2 - Low">2 - Low</option>
                    <option value="1 - Very low">1 - Very low</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Row 4: Description & File attachment -->
            <div class="form-grid-2">
              <div class="form-group">
                <label for="description" class="form-label">Detail Observation Description *</label>
                <textarea
                  id="description"
                  name="description"
                  class="input"
                  style="min-height: 90px; border-radius: 20px; resize: vertical;"
                  placeholder="Provide concrete descriptions of vocalizations, tremors, defensive posture..."
                  required
                >Crocodile agitated, thrashing water repeatedly with deep bellows, refusing normal feeding.</textarea>
              </div>

              <div class="form-group">
                <label class="form-label">Optional Media Attachment (Photo / Video) *</label>
                <div style="background-color: var(--color-input-bg); border-radius: var(--radius-input); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 90px;">
                  <label for="media-file" class="action-btn" style="cursor: pointer; padding: 7px 16px; font-size: 13.5px; border-radius: 6px; white-space: nowrap;">
                    Browse...
                  </label>
                  <input
                    type="file"
                    id="media-file"
                    name="mediaFile"
                    accept=".jpg,.jpeg,.png,.mp4"
                    style="display: none;"
                  />
                  <span id="file-name-display" style="font-size: 13.5px; color: #024123; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    No file selected
                  </span>
                  <span style="font-size: 11.5px; color: #194f38; text-align: right; line-height: 1.25; min-width: 110px;">
                    Max 30MB<br />(JPG, PNG, MP4)
                  </span>
                </div>
              </div>
            </div>

            <div id="observation-submit-error" class="field-error-msg" role="alert" style="display: none;"></div>

            <!-- Form Action Buttons -->
            <div class="form-actions-row">
              <a href="observations.html" class="action-btn" style="background-color: #0ED999;">
                Cancel
              </a>
              <button type="submit" class="action-btn" style="background-color: #0ED999;">
                Submit Verified Anomaly
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- Hazard Probability Popup Modal (Page 7 from design PDF) -->
      <div id="hazard-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-dialog hazard-modal-dialog">
          <div class="panel-header hazard-modal-header">
            <h2 id="modal-title">Hazard Probability</h2>
          </div>
          <div class="panel-body hazard-modal-body">
            <div class="card hazard-result-card">
              <p id="risk-estimate-label" class="hazard-result-label">
                Submitted Observation Risk Estimate
              </p>
              <svg
                class="hazard-gauge"
                viewBox="0 0 240 145"
                role="meter"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                aria-labelledby="modal-title risk-estimate-label"
              >
                <defs>
                  <linearGradient id="hazard-gauge-gradient" x1="40" y1="120" x2="200" y2="120" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#0ED984" />
                    <stop offset="50%" stop-color="#C7FF01" />
                    <stop offset="75%" stop-color="#F5A623" />
                    <stop offset="100%" stop-color="#FF5252" />
                  </linearGradient>
                </defs>
                <path
                  class="hazard-gauge-track"
                  d="M 40 120 A 80 80 0 0 1 200 120"
                  fill="none"
                  stroke="url(#hazard-gauge-gradient)"
                  stroke-width="20"
                  stroke-linecap="butt"
                />
                <g id="hazard-gauge-needle" transform="rotate(-90 120 120)">
                  <line x1="120" y1="120" x2="120" y2="48" class="hazard-gauge-needle" />
                </g>
                <circle cx="120" cy="120" r="8" class="hazard-gauge-hub-outer" />
                <circle cx="120" cy="120" r="3" class="hazard-gauge-hub-inner" />
              </svg>
              <div id="modal-risk-value" class="hazard-risk-value" aria-live="polite">
                84.12%
              </div>
              <div class="hazard-gauge-labels" aria-hidden="true">
                <span>Low</span>
                <span>Medium</span>
                <span>High</span>
              </div>
            </div>
            <div class="hazard-modal-actions">
              <button id="modal-close-btn" class="action-btn" style="min-width: 140px;">
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import { requireRole, getCurrentUser, saveUser } from './js/auth.js';
      import { setupFormValidation, showError, clearError } from './js/forms.js';
      import { predictHazard } from './js/data.js';
      import { addZooKeeper, getZooKeepers } from './js/api.js';
      import './js/nav.js';

      if (requireRole('zookeeper')) {
        const fileInput = document.getElementById('media-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const modal = document.getElementById('hazard-modal');
        const modalRiskValue = document.getElementById('modal-risk-value');
        const modalRiskGauge = document.querySelector('.hazard-gauge');
        const modalRiskGaugeNeedle = document.getElementById('hazard-gauge-needle');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const user = getCurrentUser();
        const totalAnimalsInput = document.getElementById('total-animals');
        const animalsShowingInput = document.getElementById('animals-showing');
        const abnormalityInput = document.getElementById('abnormality-percentage');

        function updateAbnormalityPercentage() {
          const totalAnimals = Number(totalAnimalsInput.value) || 0;
          const animalsShowing = Number(animalsShowingInput.value) || 0;
          const validTotal = totalAnimals > 0 ? totalAnimals : 0;
          const percent = validTotal > 0 ? (animalsShowing / validTotal) * 100 : 0;
          abnormalityInput.value = Math.min(Math.max(percent, 0), 100).toFixed(0);
        }

        [totalAnimalsInput, animalsShowingInput].forEach((input) => {
          input.addEventListener('input', () => {
            clearError(input);
            clearError(animalsShowingInput);
            updateAbnormalityPercentage();
          });
        });

        fileInput.addEventListener('change', () => {
          if (fileInput.files && fileInput.files[0]) {
            fileNameDisplay.textContent = fileInput.files[0].name;
          } else {
            fileNameDisplay.textContent = 'No file selected';
          }
        });

        const form = document.getElementById('upload-observation-form');
        const submissionError = document.getElementById('observation-submit-error');
        setupFormValidation(form, async (data) => {
          submissionError.style.display = 'none';
          const totalAnimals = Number(data.totalAnimals || 0);
          const animalsShowing = Number(data.animalsShowing || 0);

          if (animalsShowing > totalAnimals) {
            showError(document.getElementById('animals-showing'), 'Number of animals showing abnormal behaviour cannot be greater than the total number of animals.');
            return;
          }

          try {
            if (!user?.zoo_id) {
              throw new Error('Zoo ID is missing. Please sign in again.');
            }

            const keeperId = user.keeper_id || `demo-keeper-${Date.now()}`;
            const keepers = await getZooKeepers(user.zoo_id);
            const registeredKeeper = keepers.find((keeper) => keeper.keeper_id === keeperId);
            if (!registeredKeeper) {
              await addZooKeeper({
                username: user.username || keeperId,
                keeper_id: keeperId,
                zoo_id: user.zoo_id
              });
            }

            if (!user.keeper_id) {
              saveUser({ ...user, keeper_id: keeperId, username: user.username || keeperId });
            }

            const intensityValue = Number((data.intensity || '5 - Moderate').split(' ')[0]);
            const abnormalityPercent = totalAnimals > 0 ? Math.min((animalsShowing / totalAnimals) * 100, 100) : 0;
            const abnormalityPercentage = Number(abnormalityPercent.toFixed(0));
            const durationMinutes = Number(data.durationMinutes || 0);
            const hazardResponse = await predictHazard({
              keeper_id: keeperId,
              zoo_id: user.zoo_id,
              animal_name: data.animal,
              animal: data.animal,
              behaviour: data.observedBehaviour,
              intensity: intensityValue,
              animal_percentage: abnormalityPercentage,
              abnormality_percentage: abnormalityPercentage,
              duration: durationMinutes,
              duration_minutes: durationMinutes,
              date: new Date().toISOString()
            });

            const hazardPct = Number(
              hazardResponse?.hazard_probability ??
              hazardResponse?.hazardProbability ??
              hazardResponse?.probability ??
              hazardResponse?.prediction ??
              0
            );

            const gaugePct = Number.isFinite(hazardPct) ? Math.min(Math.max(hazardPct, 0), 100) : 0;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            modalRiskGauge.setAttribute('aria-valuenow', '0');
            modalRiskGaugeNeedle.setAttribute('transform', 'rotate(-90 120 120)');
            modalRiskValue.textContent = '0.00%';
            modal.classList.add('active');

            if (reducedMotion) {
              modalRiskGauge.setAttribute('aria-valuenow', String(gaugePct));
              modalRiskGaugeNeedle.setAttribute('transform', `rotate(${gaugePct * 1.8 - 90} 120 120)`);
              modalRiskValue.textContent = `${gaugePct.toFixed(2)}%`;
              return;
            }

            const animationDuration = 1200;
            const animationStart = performance.now();
            function animateGauge(now) {
              const progress = Math.min((now - animationStart) / animationDuration, 1);
              const easedProgress = 1 - (1 - progress) ** 3;
              const displayedPct = gaugePct * easedProgress;
              modalRiskGauge.setAttribute('aria-valuenow', displayedPct.toFixed(2));
              modalRiskValue.textContent = `${displayedPct.toFixed(2)}%`;

              if (progress < 1) {
                requestAnimationFrame(animateGauge);
              } else {
                modalRiskGaugeNeedle.setAttribute('transform', `rotate(${gaugePct * 1.8 - 90} 120 120)`);
              }
            }

            requestAnimationFrame(() => {
              modalRiskGaugeNeedle.setAttribute('transform', `rotate(${gaugePct * 1.8 - 90} 120 120)`);
              requestAnimationFrame(animateGauge);
            });
          } catch (error) {
            console.error('Observation submission error:', error);
            submissionError.textContent = error.message || 'Unable to submit observation.';
            submissionError.style.display = 'flex';
          }
        });

        updateAbnormalityPercentage();

        modalCloseBtn.addEventListener('click', () => {
          modal.classList.remove('active');
          window.location.href = 'observations.html';
        });
      }
    </script>
  </body>
</html>
